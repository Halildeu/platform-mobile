name: iOS simulator compile
on:
  pull_request:
    paths: ['app/**', 'src/**', 'plugins/**', 'modules/**', 'app.json', 'app.config.js', 'package*.json', 'scripts/ios-pcm*', '.github/workflows/mobile-ios-compile.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-ios-compile-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    # ExpoModulesJSI 57.0.8 uses foreign-reference constructor annotations introduced in Xcode 27.
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check iOS source integration
        run: node --test scripts/ios-pcm-plugin.test.cjs
      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          test -d "$DEVELOPER_DIR"
          xcodebuild -version | tee artifacts/ios/xcode-version.txt
          grep -Eq '^Xcode 27(\.[0-9]+)*$' artifacts/ios/xcode-version.txt
          sw_vers | tee artifacts/ios/macos-version.txt
          node -e 'require("fs").writeFileSync("artifacts/ios/runner-image.json", JSON.stringify({ image: process.env.ImageOS, version: process.env.ImageVersion, architecture: process.arch }))'
          xcrun swift --version | tee artifacts/ios/swift-version.txt
          xcrun --sdk iphonesimulator --show-sdk-version | tee artifacts/ios/sdk-version.txt
          pod --version | tee artifacts/ios/pod-version.txt
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = fs.readFileSync('node_modules/expo-modules-jsi/apple/Package.swift', 'utf8');
          const minimum = manifest.match(/swift-tools-version:\s*(\d+)\.(\d+)/);
          const installed = fs.readFileSync('artifacts/ios/swift-version.txt', 'utf8').match(/Swift version (\d+)\.(\d+)/);
          if (!minimum || !installed) throw new Error('Could not verify Swift tools version');
          const version = match => Number(match[1]) * 1000 + Number(match[2]);
          if (version(installed) < version(minimum)) throw new Error('Swift compiler is older than the installed ExpoModulesJSI requirement');
          NODE
      - name: Generate native iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install project pods
        working-directory: ios
        run: pod install
      - name: Compile simulator package without signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ios
          xcodebuild -workspace ios/WorkcubeMeeting.xcworkspace -scheme WorkcubeMeeting \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/workcube-ios-derived" \
            -resultBundlePath "$RUNNER_TEMP/workcube-ios-compile.xcresult" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee artifacts/ios/compile.log
          test -d "$RUNNER_TEMP/workcube-ios-derived/Build/Products/Release-iphonesimulator/WorkcubeMeeting.app"
          git rev-parse HEAD > artifacts/ios/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-compile-${{ github.sha }}
          path: |
            artifacts/ios/
            ios/Podfile.lock
          retention-days: 7
          if-no-files-found: warn
