name: Build Android device APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-device-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install locked dependencies
        run: npm ci
      - name: Generate native project from this checkout
        run: npx expo prebuild --platform android --no-install
      - name: Build phone APK from this checkout
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a '-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8' -Dorg.gradle.parallel=false --no-daemon --max-workers=1
      - name: Bind APK to exact checkout
        run: |
          mkdir -p artifacts/apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/apk/app-release.apk
          node scripts/e2e-apk.mjs seal artifacts/apk "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: android-device-apk-${{ github.sha }}
          path: artifacts/apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
