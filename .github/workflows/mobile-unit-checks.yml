name: Mobile unit and type checks
on:
  pull_request:
    paths: ['app/**', 'src/**', 'app.config.js', 'app.json', 'eas.json', '.easignore', '.gitignore', 'scripts/**', 'package*.json', 'tsconfig.json', '.github/workflows/mobile-*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test scripts/fcm-config.check.js
      - run: node --test scripts/update-plan.test.mjs scripts/update-remote.test.mjs scripts/release-config.test.mjs
      - run: node --test scripts/package-*.test.mjs
      - run: npm install --global eas-cli@24.7.0
      - run: node scripts/package-cli-check.mjs
      - run: npm test -- --runInBand --coverage --watch=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-unit-coverage
          path: coverage/
          retention-days: 7
