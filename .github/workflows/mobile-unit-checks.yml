name: Mobile unit and type checks
on:
  pull_request:
    paths: ['app/**', 'src/**', 'app.config.js', 'scripts/fcm-config.check.js', 'package*.json', 'tsconfig.json', '.github/workflows/mobile-unit-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test scripts/fcm-config.check.js
      - run: npm test -- --runInBand --coverage --watch=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-unit-coverage
          path: coverage/
          retention-days: 7
