name: E2E — Android Maestro

on:
  workflow_dispatch:
    inputs:
      target:
        description: "APK hedefi"
        required: false
        default: "emulator"
        type: choice
        options:
          - emulator
          - device
      fcm_test:
        description: "Enable isolated Android FCM TEST (requires approved organization and client config)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "plugins/**"
      - "assets/**"
      - ".maestro/**"
      - "app.json"
      - "app.config.js"
      - "scripts/fcm-config.check.js"
      - "package*.json"
      - "babel.config.js"
      - "scripts/e2e-apk*"
      - "scripts/e2e-maestro*"
      - ".github/workflows/e2e-mobile.yml"

permissions:
  contents: read
concurrency:
  group: mobile-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_ARCH: ${{ inputs.target == 'device' && 'arm64-v8a' || 'x86_64' }}
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Measure disk before build
        run: df -h . "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Test artifact handoff guard
        run: node --test scripts/e2e-apk.test.mjs scripts/e2e-maestro.test.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Validate FCM build configuration guard
        run: node --test scripts/fcm-config.check.js
      - name: Prepare isolated Android FCM TEST configuration
        if: ${{ inputs.fcm_test }}
        env:
          FCM_CLIENT_JSON: ${{ secrets.MOBILE_FCM_TEST_CLIENT_JSON }}
          TEST_ORG: ${{ vars.MOBILE_NATIVE_PUSH_TEST_ORG_ID }}
          TARGET: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          test "$TARGET" = device
          test -n "$FCM_CLIENT_JSON"
          test -n "$TEST_ORG"
          [[ "$TEST_ORG" != *$'\n'* && "$TEST_ORG" != *$'\r'* ]]
          umask 077
          printf '%s' "$FCM_CLIENT_JSON" > "$RUNNER_TEMP/google-services-test.json"
          echo "MOBILE_FCM_TEST=1" >> "$GITHUB_ENV"
          echo "MOBILE_FCM_CONFIG_PATH=$RUNNER_TEMP/google-services-test.json" >> "$GITHUB_ENV"
          echo "MOBILE_NATIVE_PUSH_ORG_ID=$TEST_ORG" >> "$GITHUB_ENV"
      - name: Generate native project from this checkout
        run: npx expo prebuild --platform android --no-install
      - name: Build APK from this checkout
        working-directory: android
        # Previous run exhausted the Expo template's 512 MiB Metaspace during lint.
        # Bound concurrency and retain lint; emulator uses a separate runner.
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures="$APK_ARCH" '-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8' -Dorg.gradle.parallel=false --no-daemon --max-workers=1
      - name: Bind APK to exact checkout
        run: |
          mkdir -p artifacts/apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/apk/app-release.apk
          node scripts/e2e-apk.mjs seal artifacts/apk "$(git rev-parse HEAD)" "$APK_ARCH"
          node scripts/e2e-apk.mjs verify artifacts/apk "$(git rev-parse HEAD)" "$APK_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.target == 'device' && 'device' || 'emulator' }}-apk-${{ github.sha }}
          path: artifacts/apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Measure disk after build
        if: always()
        run: df -h . "$RUNNER_TEMP"

  android-maestro-flow:
    if: ${{ inputs.target != 'device' }}
    needs: build-android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Independent emulator lifecycle: a suite-boundary ADB disconnect must not
    # poison the next flow. Both matrix jobs remain required; no flow retries.
    strategy:
      fail-fast: false
      matrix:
        flow: [app-launch, transcript-demo]
    env:
      CI: "1"
      MAESTRO_CLI_NO_ANALYTICS: "1"
      MAESTRO_FLOW: ${{ matrix.flow }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      # Default download scope is this workflow run, never another run's latest APK.
      - uses: actions/download-artifact@v4
        with:
          name: android-emulator-apk-${{ github.sha }}
          path: artifacts/apk/
      - name: Verify exact checkout and APK digest
        run: node scripts/e2e-apk.mjs verify artifacts/apk "$(git rev-parse HEAD)" x86_64
      - name: Measure disk before emulator
        run: df -h . "$RUNNER_TEMP"
      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maestro-cli"
          cd "$RUNNER_TEMP/maestro-cli"
          curl --fail --location --retry 3 -o maestro.zip https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip
          curl --fail --location --retry 3 -o checksums_sha256.txt https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/checksums_sha256.txt
          sha256sum --check checksums_sha256.txt
          unzip -q maestro.zip
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android UI flows
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: node scripts/e2e-maestro.mjs
      - name: Require selected flow screenshots
        run: |
          if [ "$MAESTRO_FLOW" = app-launch ]; then
            test -n "$(find artifacts/maestro -type f -name '*app-launch-success*.png' -print -quit)"
          else
            test -n "$(find artifacts/maestro -type f -name '*transcript-revised-demo*.png' -print -quit)"
            test -n "$(find artifacts/maestro -type f -name '*transcript-replayed-demo*.png' -print -quit)"
          fi
      - name: Measure disk after emulator
        if: always()
        run: df -h . "$RUNNER_TEMP"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-${{ matrix.flow }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/maestro/
            artifacts/apk/manifest.json
            *-success.png
            transcript-revised-demo.png
          if-no-files-found: warn
          retention-days: 7

  android-maestro:
    if: ${{ always() && inputs.target != 'device' }}
    needs: [build-android-apk, android-maestro-flow]
    runs-on: ubuntu-latest
    steps:
      - name: Require build and every isolated flow
        env:
          BUILD_RESULT: ${{ needs.build-android-apk.result }}
          FLOWS_RESULT: ${{ needs.android-maestro-flow.result }}
        run: test "$BUILD_RESULT" = success && test "$FLOWS_RESULT" = success
