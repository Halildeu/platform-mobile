name: E2E — Android Maestro

on:
  workflow_dispatch:
    inputs:
      target:
        description: "APK hedefi"
        required: false
        default: "emulator"
        type: choice
        options:
          - emulator
          - device
  pull_request:
    paths:
      - "app/**"
      - "src/**"
      - "plugins/**"
      - "assets/**"
      - ".maestro/**"
      - "app.json"
      - "package*.json"
      - "babel.config.js"
      - "scripts/e2e-apk*"
      - ".github/workflows/e2e-mobile.yml"

permissions:
  contents: read
concurrency:
  group: mobile-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APK_ARCH: ${{ inputs.target == 'device' && 'arm64-v8a' || 'x86_64' }}
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Measure disk before build
        run: df -h . "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Test artifact handoff guard
        run: node --test scripts/e2e-apk.test.mjs
      - name: Install locked dependencies
        run: npm ci
      - name: Generate native project from this checkout
        run: npx expo prebuild --platform android --no-install
      - name: Build APK from this checkout
        working-directory: android
        # Previous run exhausted the Expo template's 512 MiB Metaspace during lint.
        # Bound concurrency and retain lint; emulator uses a separate runner.
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures="$APK_ARCH" '-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8' -Dorg.gradle.parallel=false --no-daemon --max-workers=1
      - name: Bind APK to exact checkout
        run: |
          mkdir -p artifacts/apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/apk/app-release.apk
          node scripts/e2e-apk.mjs seal artifacts/apk "$(git rev-parse HEAD)" "$APK_ARCH"
          node scripts/e2e-apk.mjs verify artifacts/apk "$(git rev-parse HEAD)" "$APK_ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.target == 'device' && 'device' || 'emulator' }}-apk-${{ github.sha }}
          path: artifacts/apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Measure disk after build
        if: always()
        run: df -h . "$RUNNER_TEMP"

  android-maestro:
    if: ${{ inputs.target != 'device' }}
    needs: build-android-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      MAESTRO_CLI_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      # Default download scope is this workflow run, never another run's latest APK.
      - uses: actions/download-artifact@v4
        with:
          name: android-emulator-apk-${{ github.sha }}
          path: artifacts/apk/
      - name: Verify exact checkout and APK digest
        run: node scripts/e2e-apk.mjs verify artifacts/apk "$(git rev-parse HEAD)" x86_64
      - name: Measure disk before emulator
        run: df -h . "$RUNNER_TEMP"
      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/maestro-cli"
          cd "$RUNNER_TEMP/maestro-cli"
          curl --fail --location --retry 3 -o maestro.zip https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/maestro.zip
          curl --fail --location --retry 3 -o checksums_sha256.txt https://github.com/mobile-dev-inc/Maestro/releases/download/cli-2.10.0/checksums_sha256.txt
          sha256sum --check checksums_sha256.txt
          unzip -q maestro.zip
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android UI flows
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r artifacts/apk/app-release.apk
            mkdir -p artifacts/maestro
            maestro test -e APP_ID=com.workcube.meeting --format junit --output artifacts/maestro/results.xml --debug-output artifacts/maestro --test-output-dir artifacts/maestro .maestro/
      - name: Require both successful-flow screenshots
        run: |
          test -n "$(find artifacts/maestro -type f -name '*app-launch-success*.png' -print -quit)"
          test -n "$(find artifacts/maestro -type f -name '*transcript-revised-demo*.png' -print -quit)"
      - name: Measure disk after emulator
        if: always()
        run: df -h . "$RUNNER_TEMP"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-maestro-${{ github.sha }}
          path: |
            artifacts/maestro/
            artifacts/apk/manifest.json
            *-success.png
            transcript-revised-demo.png
          if-no-files-found: warn
          retention-days: 7
