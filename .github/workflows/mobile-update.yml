name: Mobile staged update
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [publish-5, advance-25, advance-100, revert-current, rollback-previous, rollback-embedded]
        required: true
      channel:
        type: choice
        options: [development, preview, production]
        required: true
      group:
        description: 'Exact CURRENT update group (required except for publish-5)'
        type: string
        required: false
      previous_group:
        description: 'Exact previous group (only for rollback-previous)'
        type: string
        required: false
      platform:
        type: choice
        options: [android, ios]
        required: true
      build_id:
        description: 'Accepted FINISHED ota-* native build UUID for this channel/platform'
        type: string
        required: true
      execute:
        description: 'Apply after remote preflight; false only writes the plan receipt'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mobile-update-${{ inputs.channel }}
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: mobile-${{ inputs.channel }}
    env:
      UPDATE_OPERATION: ${{ inputs.operation }}
      UPDATE_CHANNEL: ${{ inputs.channel }}
      UPDATE_GROUP: ${{ inputs.group }}
      UPDATE_PREVIOUS_GROUP: ${{ inputs.previous_group }}
      UPDATE_PLATFORM: ${{ inputs.platform }}
      UPDATE_BUILD_ID: ${{ inputs.build_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/update-plan.test.mjs scripts/update-remote.test.mjs scripts/release-config.test.mjs
      - name: Freeze validated release intent before loading the EAS environment
        run: node scripts/update-execute.mjs --intent
      - run: npm run typecheck
      - run: npm test -- --runInBand
      - name: Install EAS CLI
        run: npm install --global eas-cli@24.7.0
      - name: Read remote preflight and optionally execute once
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APPLY_UPDATE: ${{ inputs.execute }}
        shell: bash
        run: |
          if [ "$APPLY_UPDATE" = 'true' ]; then
            eas env:exec "$UPDATE_CHANNEL" 'MOBILE_OTA_ENABLED=1 node scripts/update-execute.mjs --execute' --non-interactive
          else
            eas env:exec "$UPDATE_CHANNEL" 'MOBILE_OTA_ENABLED=1 node scripts/update-execute.mjs' --non-interactive
          fi
      - name: Preserve sanitized outcome, including uncertain operations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-update-${{ inputs.channel }}-${{ inputs.platform }}-${{ github.run_id }}
          path: release-evidence/
          retention-days: 30
